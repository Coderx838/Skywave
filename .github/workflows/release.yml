name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build and Package Binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          
          mkdir -p build_output
          go build -trimpath -ldflags="-s -w" -o build_output/skywave${EXT} ./cmd/skywave
          go build -trimpath -ldflags="-s -w" -o build_output/skywave-server${EXT} ./cmd/skywave-server
          
          TAG_NAME=${{ github.ref_name }}
          PKG_NAME="skywave-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cd build_output
            zip -r "../dist/${PKG_NAME}.zip" skywave.exe skywave-server.exe
            cd ..
          else
            cd build_output
            tar -czvf "../dist/${PKG_NAME}.tar.gz" skywave skywave-server
            cd ..
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
